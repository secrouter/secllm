[project]
name = "secllm"
version = "1.0.0"
description = "SecLLM — a vLLM control plane with model health management, hot reload, and a non-expert console."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Austin Probe" }]
keywords = ["vllm", "llm", "inference", "openai", "gpu", "model-management", "secrouter"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # Direct dep (not just transitive via the mlx/vllm extras): the admin console's download
    # button (downloads.py) needs to check/trigger HF Hub caching regardless of which
    # inference backend is actually installed.
    "huggingface_hub>=0.24",
    # Optional SSO for the admin plane (auth.py) — SecSSO/OIDC bearer + BFF login. The same OIDC
    # library the rest of the suite's Python services use; [crypto] pulls in RS256/JWKS support.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# The real inference backend — GPU/Linux only; installed in the image, never on macOS.
vllm = ["vllm>=0.6"]
# The real inference backend on Apple Silicon — installed on macOS instead of vllm (see
# targets/macos.py); >=0.28 for gpt-oss architecture support (see backends/mlx_server.py).
mlx = ["mlx-lm>=0.28"]

[project.scripts]
secllm = "secllm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secllm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
